name: Update news feed

on:
  schedule:
    # Avoid GitHub's busiest minute at the top and middle of each hour.
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - newsfeed.py
      - config/sources.json
      - requirements.txt
      - requirements.lock
      - tests/**
      - .github/workflows/update-feed.yml

permissions:
  contents: read

concurrency:
  group: newsfeed-update
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Restore private runtime cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/newsfeed
          key: newsfeed-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            newsfeed-${{ runner.os }}-

      - name: Install dependencies
        run: python -m pip install --require-hashes --requirement requirements.lock

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build feed
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GEMINI_EMBEDDING_MODEL: ${{ vars.GEMINI_EMBEDDING_MODEL || 'gemini-embedding-2' }}
          PUBLIC_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python newsfeed.py

      - name: Validate generated files
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          ET.parse("public/feed.xml")
          status = json.loads(Path("public/status.json").read_text(encoding="utf-8"))
          assert Path("public/index.html").stat().st_size > 500
          assert status["articles_published"] >= 0
          assert "metadata" in status
          assert "embeddings" in status
          print(f"Validated {status['articles_published']} published articles")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
